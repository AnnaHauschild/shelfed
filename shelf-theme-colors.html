<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shelfed — Shelf-Background Farbwelten (Vorschau)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0c0a08;
    color: #efe3d2;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 28px 20px 60px;
  }
  h1 { font-family: "Oswald"; font-weight: 700; letter-spacing: 1px; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; color: #a9977c; font-size: 13px; margin: 0 0 26px; }

  .row { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .theme { width: 300px; }
  .theme .name {
    font-family: "Oswald"; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px;
    font-size: 15px; text-align: center; margin: 0 0 10px; color: #e7d6bd;
  }

  /* Phone-shaped panel showing the full background: header deco + shelf rack */
  .screen {
    position: relative; width: 300px; height: 600px;
    border-radius: 26px; overflow: hidden;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* ---- Header band (top deco) ---- */
  .header { position: relative; height: 150px; overflow: hidden; }
  .header .wordmark {
    position: absolute; left: 20px; bottom: 26px; z-index: 3;
    font-family: "Oswald"; font-weight: 700; font-size: 30px; letter-spacing: 1px;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .header .tagline {
    position: absolute; left: 21px; bottom: 14px; z-index: 3;
    font-family: "Special Elite"; font-size: 11px; letter-spacing: 0.5px;
  }
  .lamp { position: absolute; top: 0; left: 60px; width: 56px; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .lamp .glow { position: absolute; top: 12px; left: 50%; width: 170px; height: 96px; border-radius: 50%; transform: translateX(-50%); }
  .lamp .cord { width: 2px; height: 16px; }
  .lamp .shade { width: 56px; height: 28px; border-radius: 28px 28px 4px 4px; }
  .plant { position: absolute; bottom: 16px; right: 96px; width: 40px; height: 60px; z-index: 2; }
  .plant .pot { position: absolute; bottom: 0; left: 6px; width: 28px; height: 22px; border-radius: 3px 3px 6px 6px; }
  .plant .leaf { position: absolute; width: 12px; height: 26px; border-radius: 12px 12px 12px 12px / 20px 20px 6px 6px; bottom: 18px; }
  .books { position: absolute; bottom: 14px; right: 14px; display: flex; align-items: flex-end; z-index: 2; }
  .books .spine { width: 10px; margin-left: 2px; border-radius: 2px 2px 0 0; position: relative; overflow: hidden; }
  .books .spine .hi { position: absolute; top: 0; left: 0; right: 0; height: 1px; background: rgba(255,240,200,0.45); }
  .books .spine .band { position: absolute; left: 1px; right: 1px; top: 22%; height: 2px; opacity: 0.9; }
  .plank { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; z-index: 2; }

  /* ---- Shelf rack (cubbies) ---- */
  .rack { position: absolute; top: 150px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
  .cubby { position: relative; overflow: hidden; border-right: 1px solid rgba(0,0,0,0.35); border-bottom: 1px solid rgba(0,0,0,0.45); }
  .cubby .wash { position: absolute; inset: 0; }
  .cubby .ledbar { position: absolute; top: 0; left: 12%; right: 12%; height: 2px; border-radius: 2px; }
  .cubby .content { position: absolute; left: 6px; right: 6px; bottom: 4px; display: flex; align-items: flex-end; justify-content: center; height: 74%; }
  .cubby .spine { margin: 0 0.7px; border-radius: 1px 1px 0 0; position: relative; overflow: hidden; }
  .cubby .spine .hi { position: absolute; top: 0; left: 0; right: 0; height: 1px; background: rgba(255,235,200,0.35); }
  .cubby .frame { width: 60%; height: 60%; border-radius: 3px; align-self: center; }
  .cubby .cplant { position: relative; width: 34px; height: 40px; align-self: flex-end; }
  .cubby .cplant .pot { position: absolute; bottom: 0; left: 7px; width: 20px; height: 15px; border-radius: 2px 2px 5px 5px; }
  .cubby .cplant .leaf { position: absolute; width: 9px; height: 20px; border-radius: 9px 9px 9px 9px / 16px 16px 5px 5px; bottom: 12px; }

  .note { max-width: 820px; margin: 26px auto 0; text-align: center; color: #a9977c; font-size: 12.5px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>Shelf-Background — Farbwelten</h1>
  <p class="sub">Gleicher Stil · Overhead-Lampen bleiben · kompletter Hintergrund (Kopf-Deko + Regal) einheitlich umgefärbt</p>
  <div class="row" id="row"></div>
  <p class="note">Alles nur Browser-Vorschau — nichts wurde in die App eingebaut. Jede Farbwelt färbt <b>Kopf-Deko und Regal gemeinsam</b>, damit nichts mehr unstimmig wirkt.</p>

<script>
  // Deterministic pseudo-random
  function rng(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646; return ()=>{ s=s*16807%2147483647; return (s-1)/2147483646; }; }

  const THEMES = [
    {
      name: 'Classic (jetzt)',
      wall: ['#5a3618','#3e2410','#26160b'],
      plank: '#5a3618', plankTop: '#8a5828',
      shade: '#f0d28c', glow: 'rgba(255,220,130,0.18)',
      wash: 'rgba(255,184,112,0.30)', led: 'rgba(255,214,150,0.9)',
      cubbyBack: '#2a1808',
      books: ['#a7563d','#7a3527','#5e7a3c','#3f6079','#d8a548','#8a5a2b','#b89b73','#2c4a3a'],
      band: '#d8a548', potA: '#8a5a2b', leaf: '#4f6b35', leafB: '#7a9658',
    },
    {
      name: 'Twilight Blue',
      wall: ['#2a3f52','#1b2b3a','#0e1724'],
      plank: '#2f4a5e', plankTop: '#4f7690',
      shade: '#dcecfb', glow: 'rgba(150,200,255,0.18)',
      wash: 'rgba(160,205,255,0.28)', led: 'rgba(200,225,255,0.95)',
      cubbyBack: '#14202e',
      books: ['#3f6079','#2c4a5a','#5a7a8c','#6d8fa3','#8aa9bd','#345a6b','#274b5e','#4a6f83'],
      band: '#9ec4dd', potA: '#2f4a5e', leaf: '#3f6b5a', leafB: '#6a9a86',
    },
    {
      name: 'Forest Green',
      wall: ['#2e3d24','#1e2b18','#0f1c0d'],
      plank: '#3a4a28', plankTop: '#5e7a3c',
      shade: '#f0e8c0', glow: 'rgba(205,220,140,0.18)',
      wash: 'rgba(215,228,150,0.26)', led: 'rgba(230,235,180,0.92)',
      cubbyBack: '#1a2612',
      books: ['#5e7a3c','#3f5f2c','#7a9658','#4f6b35','#8a7a2b','#b89b73','#2c4a3a','#6d7a3c'],
      band: '#cdd98a', potA: '#5a4326', leaf: '#3f6b2c', leafB: '#7a9658',
    },
    {
      name: 'Plum / Aubergine',
      wall: ['#3a2438','#281827','#150d15'],
      plank: '#4a2a44', plankTop: '#7a4a6c',
      shade: '#f2d4e2', glow: 'rgba(230,160,205,0.18)',
      wash: 'rgba(255,185,215,0.24)', led: 'rgba(255,205,230,0.92)',
      cubbyBack: '#221426',
      books: ['#7a3d5f','#5e2c4a','#a3567a','#8a5a5b','#b8737f','#4a2a44','#6d4062','#a5497a'],
      band: '#e3a9c4', potA: '#5e2c4a', leaf: '#4f6b45', leafB: '#7a9673',
    },
    {
      name: 'Slate / Modern',
      wall: ['#3a3d40','#26282a','#141516'],
      plank: '#40444a', plankTop: '#6a707a',
      shade: '#eef2f5', glow: 'rgba(210,225,240,0.20)',
      wash: 'rgba(220,235,250,0.26)', led: 'rgba(235,245,255,0.95)',
      cubbyBack: '#1c1e20',
      books: ['#5a6069','#454a52','#6d7680','#8a929c','#3a3f47','#7a828c','#565d66','#9aa2ac'],
      band: '#aeb6c0', potA: '#454a52', leaf: '#556b5a', leafB: '#84948a',
    },
  ];

  function cubby(t, seed){
    const r = rng(seed*7+3);
    const kind = r();
    let inner = '';
    if (kind > 0.86) {
      // framed picture
      inner = `<div class="frame" style="background:linear-gradient(160deg, ${t.books[3]}, ${t.cubbyBack})"></div>`;
    } else if (kind > 0.74) {
      // small plant
      inner = `<div class="cplant">
        <span class="leaf" style="left:6px;background:${t.leaf};transform:rotate(-18deg)"></span>
        <span class="leaf" style="left:13px;background:${t.leafB}"></span>
        <span class="leaf" style="left:20px;background:${t.leaf};transform:rotate(18deg)"></span>
        <span class="pot" style="background:${t.potA}"></span>
      </div>`;
    } else {
      // row of spines
      const n = 5 + Math.floor(r()*4);
      let s='';
      for (let i=0;i<n;i++){
        const w = 6 + r()*5;
        const h = 60 + r()*34;
        const col = t.books[Math.floor(r()*t.books.length)];
        const band = r()>0.6 ? `<span class="band" style="position:absolute;left:1px;right:1px;top:24%;height:2px;background:${t.band};opacity:.85"></span>` : '';
        s += `<div class="spine" style="width:${w}px;height:${h}%;background:${col}"><span class="hi"></span>${band}</div>`;
      }
      inner = s;
    }
    return `<div class="cubby" style="background:${t.cubbyBack}">
      <div class="wash" style="background:linear-gradient(to bottom, ${t.wash} 0%, ${hexa(t.wash,0.25)} 34%, transparent 72%)"></div>
      <div class="ledbar" style="background:${t.led};box-shadow:0 0 6px ${t.led}"></div>
      <div class="content">${inner}</div>
    </div>`;
  }

  // fade an rgba() string's alpha
  function hexa(rgba, mul){
    const m = rgba.match(/rgba?\(([^)]+)\)/); if(!m) return rgba;
    const p = m[1].split(',').map(x=>x.trim());
    const a = p.length>3 ? parseFloat(p[3]) : 1;
    return `rgba(${p[0]},${p[1]},${p[2]},${(a*mul).toFixed(3)})`;
  }

  function headerBooks(t){
    const hs=[128,148,138,120,158,140];
    return hs.map((h,i)=>{
      const col=t.books[i%t.books.length];
      const band = i!==3 ? `<span class="band" style="background:${t.band}"></span>`:'';
      return `<div class="spine" style="height:${h*0.34}px;background:${col}"><span class="hi"></span>${band}</div>`;
    }).join('');
  }

  function screen(t){
    // 3 columns x 3 rows of cubbies
    let cubbies='';
    for (let i=0;i<9;i++) cubbies += cubby(t, i+1);
    return `<div class="theme">
      <div class="name">${t.name}</div>
      <div class="screen">
        <div class="header" style="background:linear-gradient(135deg, ${t.wall[0]}, ${t.wall[1]} 70%, ${t.wall[2]})">
          <div class="lamp">
            <span class="glow" style="background:radial-gradient(circle, ${t.glow} 0%, transparent 70%)"></span>
            <span class="cord" style="background:${t.plankTop}"></span>
            <span class="shade" style="background:${t.shade}"></span>
          </div>
          <div class="plant">
            <span class="leaf" style="left:6px;background:${t.leaf};transform:rotate(-20deg)"></span>
            <span class="leaf" style="left:14px;background:${t.leafB}"></span>
            <span class="leaf" style="left:22px;background:${t.leaf};transform:rotate(20deg)"></span>
            <span class="pot" style="background:${t.potA}"></span>
          </div>
          <div class="books">${headerBooks(t)}</div>
          <div class="wordmark">Shelfed</div>
          <div class="tagline" style="color:${t.band}">Swipe your films</div>
          <div class="plank" style="background:${t.plank};border-top:3px solid ${t.plankTop};border-bottom:2px solid #120a05"></div>
        </div>
        <div class="rack">${cubbies}</div>
      </div>
    </div>`;
  }

  document.getElementById('row').innerHTML = THEMES.map(screen).join('');
</script>
</body>
</html>
